<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12384f" />
  <title>행사 일정 | 운영 실시간 모니터</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="admin-monitor.css?v=20260827-places1" />
</head>
<body data-page="schedule">
  <div class="admin-layout">
    <aside class="sidebar" aria-label="관리 메뉴">
      <div class="brand"><div class="brand-mark" aria-hidden="true">♪</div><div><strong>다대포 해변 축제</strong><small>QR 스탬프 운영</small></div></div>
      <nav class="side-nav">
        <a class="nav-btn" data-page="overview" href="index.html">운영 현황</a>
        <a class="nav-btn" data-page="participants" href="participants.html">참가자 목록</a>
        <a class="nav-btn" data-page="booths" href="booths.html">부스 현황</a>
        <a class="nav-btn" data-page="broadcast" href="broadcast.html">실시간 공지</a>
        <a class="nav-btn" data-page="schedule" href="schedule.html">행사 일정</a>
      </nav>
      <div class="side-bottom"><span>관리 화면</span><strong>saegim-qr</strong></div>
    </aside>
    <div class="admin-main">
      <header class="topbar">
        <div class="title-group"><p class="eyebrow">Live Schedule</p><h1>행사 일정</h1><p>참가자 앱 일정 탭에 표시되는 프로그램을 관리합니다.</p></div>
        <div class="top-actions"><span class="status-pill"><i></i><span id="topConnectionText">연결 중</span></span><a class="ghost-btn" href="https://dadaepo-festival.web.app/">참가자 앱</a></div>
      </header>
      <main class="monitor-shell">
        <section class="panel schedule-panel">
          <div class="panel-head">
            <div><p class="eyebrow">Program</p><h2>행사 일정 관리</h2><p class="desc">예정·진행 중·완료 상태는 입력한 시간을 기준으로 자동으로 판정됩니다.</p></div>
            <span id="scheduleState" class="email-pill">연결 중</span>
          </div>
          <div class="schedule-day-toolbar" id="scheduleDayToolbar" aria-label="관리할 행사 일차">
            <button class="active" type="button" data-day="1">1일차</button><button type="button" data-day="2">2일차</button><button type="button" data-day="3">3일차</button>
          </div>
          <div class="schedule-form-grid">
            <label class="bc-field"><span>행사 일차</span><select id="schDay"><option value="1">1일차</option><option value="2">2일차</option><option value="3">3일차</option></select></label>
            <label class="bc-field"><span>날짜</span><input id="schDate" type="date" /></label>
            <label class="bc-field"><span>시작 시간</span><input id="schTime" type="text" inputmode="numeric" maxlength="5" placeholder="18:00" /></label>
            <label class="bc-field"><span>종료 시간</span><input id="schEnd" type="text" inputmode="numeric" maxlength="5" placeholder="18:30" /></label>
            <label class="bc-field"><span>장소</span><input id="schPlace" type="text" maxlength="40" placeholder="메인 무대" /></label>
            <label class="bc-field bc-full"><span>제목</span><input id="schTitle" type="text" maxlength="60" placeholder="예: 다대포 해변 가요제 1부" /></label>
            <label class="bc-field bc-full"><span>설명</span><textarea id="schDesc" rows="2" maxlength="200" placeholder="참가자에게 보여줄 짧은 설명"></textarea></label>
            <label class="check-field bc-full"><input id="schPublished" type="checkbox" /><span>저장과 동시에 사용자 앱에 공개</span></label>
          </div>
          <div class="broadcast-actions"><button id="schSubmitBtn" class="primary-btn" type="button">일정 저장</button><button id="schResetBtn" class="ghost-btn" type="button" hidden>새로 작성</button><button id="schPublishDayBtn" class="ghost-btn" type="button">1일차 전체 공개</button></div>
          <p id="schMsg" class="bc-status"></p>
          <div class="broadcast-list-head"><h3 id="scheduleListTitle">1일차 일정 목록</h3></div>
          <div id="schList" class="broadcast-list"><div class="empty">아직 등록된 일정이 없습니다.</div></div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="admin-monitor.js?v=20260831-schedule-days1"></script>
</body>
</html>
